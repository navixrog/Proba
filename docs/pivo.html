<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pivska karta">
  <meta name="theme-color" content="#C8821E">
  <link rel="manifest" href="pivo-manifest.json">
  <title>Pivska karta 🍺</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    :root {
      --amber:       #C8821E;
      --amber-dark:  #A9690F;
      --amber-light: #F5C96A;
      --amber-faint: #FFF3DC;
      --gold:        #E8B23A;
      --cream:       #FFF8EC;
      --parchment:   #F5EDD8;
      --border:      #E8DBCC;
      --muted:       #9A876A;
      --text:        #2C1A07;
      --text-2:      #6B5030;
      --white:       #FFFFFF;
      --danger:      #D93B3B;
      --bg:          var(--cream);
      --card:        var(--white);
      --nav-bg:      var(--white);
      --shadow-sm:   0 1px 4px rgba(80,50,10,.08);
      --shadow-md:   0 4px 16px rgba(80,50,10,.12);
      --shadow-lg:   0 8px 32px rgba(80,50,10,.18);
      --ease-spring: cubic-bezier(.34,1.56,.64,1);
      --ease-out:    cubic-bezier(.22,.61,.36,1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --amber:#E09A38; --amber-dark:#C8821E; --amber-faint:#2A1A00;
        --cream:#1A1008; --parchment:#241608; --border:#3A2810;
        --muted:#8A7060; --text:#F0E0C8; --text-2:#C0A080;
        --bg:#1A1008; --card:#241608; --nav-bg:#1E1208;
        --shadow-sm:0 1px 4px rgba(0,0,0,.3); --shadow-md:0 4px 16px rgba(0,0,0,.4); --shadow-lg:0 8px 32px rgba(0,0,0,.5);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
    }

    html, body {
      height:100%; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg); color:var(--text); overflow:hidden; -webkit-font-smoothing:antialiased;
    }

    /* ── Onboarding screen ─────────────────────────────────────────────────── */
    .screen {
      position:fixed; inset:0; background:var(--bg); z-index:3000;
      display:none; flex-direction:column;
      padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .screen.visible { display:flex; }

    .screen-inner {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:32px 28px; max-width:420px; margin:0 auto; width:100%;
    }

    .screen-icon { font-size:64px; margin-bottom:12px; }
    .screen-title {
      font-family:'Fraunces',serif; font-size:28px; font-weight:900;
      color:var(--amber-dark); text-align:center; margin-bottom:6px;
    }
    .screen-sub {
      font-size:14px; color:var(--muted); text-align:center;
      line-height:1.5; margin-bottom:28px; max-width:280px;
    }

    .name-avatar {
      width:80px; height:80px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:36px; font-weight:700; color:#fff;
      margin-bottom:20px; box-shadow:var(--shadow-md);
      transition:background .3s ease, transform .2s var(--ease-spring);
    }

    /* ── App layout ─────────────────────────────────────────────────────── */
    #app { display:flex; flex-direction:column; height:100dvh; }

    .header {
      background:linear-gradient(160deg,var(--cream) 0%,var(--parchment) 100%);
      padding:14px 16px 10px;
      padding-top:calc(14px + env(safe-area-inset-top));
      border-bottom:1px solid var(--border);
      z-index:500;
    }

    .header-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .header-brand { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
    .header-icon {
      font-size:24px; animation:sway 3s ease-in-out infinite;
      display:inline-block; transform-origin:bottom center; flex-shrink:0;
    }
    @keyframes sway { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
    .header h1 {
      font-family:'Fraunces',serif; font-size:20px; font-weight:900;
      color:var(--amber); letter-spacing:-.5px; line-height:1;
    }

    .user-btn {
      border:none; background:none; cursor:pointer; padding:2px; flex-shrink:0;
      border-radius:50%; transition:transform .15s var(--ease-spring);
    }
    .user-btn:active { transform:scale(.9); }
    .user-avatar-hdr {
      width:36px; height:36px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:15px; font-weight:700; color:#fff;
      box-shadow:var(--shadow-md); background:var(--amber);
    }

    .header-members {
      margin-top:7px; display:flex; align-items:center; gap:10px;
      overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
    }
    .header-members::-webkit-scrollbar { display:none; }
    .header-member-chip {
      display:flex; align-items:center; gap:4px;
      font-size:11px; font-weight:600; color:var(--muted);
      white-space:nowrap; flex-shrink:0;
    }
    .header-member-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

    /* ── Main ───────────────────────────────────────────────────────────── */
    .main { flex:1; overflow:hidden; position:relative; }
    .tab { display:none; height:100%; }
    .tab.active { display:block; }
    .tab.scrolly { overflow-y:auto; -webkit-overflow-scrolling:touch; }

    /* ── Map ────────────────────────────────────────────────────────────── */
    #map { height:100%; width:100%; background:var(--parchment); }

    .leaflet-popup-content-wrapper { border-radius:14px !important; box-shadow:var(--shadow-lg) !important; }
    .leaflet-popup-content { margin:12px 14px !important; font-family:'Inter',sans-serif !important; font-size:13px !important; line-height:1.5 !important; }
    .leaflet-popup-content b { font-family:'Fraunces',serif; font-size:15px; color:var(--amber-dark); }

    .beer-pin { font-size:28px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35)); text-align:center; line-height:1; }
    .member-pin {
      width:32px; height:32px; border-radius:50%; border:2.5px solid #fff;
      display:flex; align-items:center; justify-content:center;
      font-family:'Inter',sans-serif; font-size:13px; font-weight:700; color:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.35);
    }

    .map-legend {
      position:absolute; left:12px; bottom:12px; z-index:600;
      background:rgba(255,248,236,.92); backdrop-filter:blur(6px);
      border:1px solid var(--border); border-radius:12px;
      padding:10px 14px; display:none; flex-direction:column; gap:7px;
      box-shadow:var(--shadow-md);
    }
    .map-legend.visible { display:flex; }
    .legend-item { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; }
    .legend-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }

    .fab {
      position:absolute; right:18px; bottom:18px;
      width:58px; height:58px; border-radius:50%;
      background:linear-gradient(145deg,var(--amber),var(--amber-dark));
      color:#fff; border:none; font-size:28px;
      box-shadow:0 6px 20px rgba(168,105,15,.5);
      cursor:pointer; z-index:600;
      display:flex; align-items:center; justify-content:center;
      transition:transform .18s var(--ease-spring), box-shadow .18s ease;
    }
    .fab:hover { transform:scale(1.08); box-shadow:0 10px 28px rgba(168,105,15,.55); }
    .fab:active { transform:scale(.92); }

    /* ── Filter pills ─────────────────────────────────────────────────────── */
    .filter-row {
      padding:12px 16px 0; display:flex; gap:8px; overflow-x:auto;
      scrollbar-width:none; -ms-overflow-style:none;
    }
    .filter-row::-webkit-scrollbar { display:none; }
    .filter-pill {
      border:1.5px solid var(--border); background:var(--card); border-radius:20px;
      padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer;
      white-space:nowrap; color:var(--muted); flex-shrink:0;
      transition:all .15s ease; font-family:'Inter',sans-serif;
      display:flex; align-items:center; gap:6px;
    }
    .filter-pill.active { background:var(--amber); color:#fff; border-color:var(--amber-dark); }
    .filter-pill-dot { width:10px; height:10px; border-radius:50%; }

    /* ── List cards ──────────────────────────────────────────────────────── */
    .list { padding:12px 16px; display:flex; flex-direction:column; gap:10px; padding-bottom:32px; }

    .card {
      background:var(--card); border-radius:16px; padding:14px 14px 14px 0;
      box-shadow:var(--shadow-sm); display:flex; gap:0; align-items:flex-start;
      overflow:hidden; border:1px solid var(--border);
      transition:box-shadow .2s ease, transform .2s ease;
    }
    .card:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
    .card-stripe { width:4px; align-self:stretch; min-height:56px; border-radius:0 2px 2px 0; flex-shrink:0; margin-right:12px; }
    .card-emoji { font-size:26px; line-height:1; flex-shrink:0; margin-right:10px; margin-top:2px; }
    .card-body { flex:1; min-width:0; }
    .card-member-name { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
    .card-beer { font-size:15px; font-weight:700; line-height:1.3; }
    .card-place { font-size:12px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:3px; font-weight:500; }
    .card-stars { font-size:13px; margin-top:5px; letter-spacing:1px; }
    .card-note { font-size:12px; color:var(--text-2); margin-top:5px; font-style:italic; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card-meta { font-size:11px; color:var(--muted); margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; font-weight:500; }
    .card-actions { display:flex; flex-direction:column; gap:4px; align-items:flex-end; flex-shrink:0; margin-left:6px; }
    .icon-btn { border:none; background:none; cursor:pointer; font-size:16px; padding:6px; border-radius:8px; transition:background .15s ease; }
    .icon-btn:hover { background:var(--parchment); }
    .icon-btn.del { color:var(--danger); }

    /* Empty state */
    .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:40px 32px; gap:12px; text-align:center; }
    .empty-icon-wrap { width:88px; height:88px; border-radius:50%; background:var(--amber-faint); display:flex; align-items:center; justify-content:center; font-size:44px; margin-bottom:4px; border:2px dashed var(--border); }
    .empty-text { font-size:17px; font-weight:700; color:var(--text); font-family:'Fraunces',serif; }
    .empty-hint { font-size:13px; color:var(--muted); line-height:1.5; max-width:240px; }

    /* ── Stats ────────────────────────────────────────────────────────────── */
    .stats-content { padding:16px; display:flex; flex-direction:column; gap:16px; padding-bottom:36px; }
    .stats-header { font-family:'Fraunces',serif; font-size:18px; font-weight:900; color:var(--amber-dark); padding:4px 0 0; }
    .summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .summary-grid.col2 { grid-template-columns:1fr 1fr; }
    .summary-card { background:var(--card); border-radius:14px; padding:14px 10px 12px; text-align:center; box-shadow:var(--shadow-sm); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:4px; }
    .summary-icon { font-size:20px; }
    .summary-label { font-size:10px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
    .summary-value { font-size:22px; font-weight:800; color:var(--amber); font-family:'Fraunces',serif; line-height:1; }
    .section-title { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-top:4px; }
    .rank-card { background:var(--card); border-radius:16px; overflow:hidden; box-shadow:var(--shadow-sm); border:1px solid var(--border); }
    .rank-row { display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--border); transition:background .15s ease; }
    .rank-row:last-child { border-bottom:none; }
    .rank-row:hover { background:var(--amber-faint); }
    .rank-pos { font-size:16px; width:22px; text-align:center; flex-shrink:0; }
    .rank-name { flex:1; font-size:14px; font-weight:600; }
    .rank-bar-wrap { flex:1.5; height:7px; background:var(--parchment); border-radius:4px; overflow:hidden; }
    .rank-bar { height:100%; background:linear-gradient(90deg,var(--amber),var(--gold)); border-radius:4px; }
    .rank-count { font-size:13px; font-weight:700; color:var(--amber); width:28px; text-align:right; }
    .person-section { background:var(--card); border-radius:16px; overflow:hidden; box-shadow:var(--shadow-sm); border:1px solid var(--border); }
    .person-header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); }
    .person-avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#fff; flex-shrink:0; }
    .person-name { font-size:15px; font-weight:700; flex:1; }
    .person-count { font-size:13px; color:var(--muted); }
    .person-stats { display:grid; grid-template-columns:1fr 1fr 1fr; }
    .person-stat { padding:10px 12px; text-align:center; border-right:1px solid var(--border); }
    .person-stat:last-child { border-right:none; }
    .person-stat-val { font-size:16px; font-weight:800; color:var(--amber); font-family:'Fraunces',serif; }
    .person-stat-lbl { font-size:10px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px; margin-top:2px; }

    /* ── Bottom nav ──────────────────────────────────────────────────────── */
    .nav { display:flex; background:var(--nav-bg); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom); }
    .nav-btn { flex:1; border:none; background:none; padding:10px 8px 8px; cursor:pointer; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; transition:color .2s ease; position:relative; }
    .nav-btn.active { color:var(--amber); }
    .nav-btn.active::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:32px; height:3px; background:var(--amber); border-radius:0 0 3px 3px; animation:indicatorIn .22s var(--ease-spring); }
    @keyframes indicatorIn { from{width:0;opacity:0} to{width:32px;opacity:1} }
    .nav-icon { font-size:20px; }
    .nav-label { font-size:10px; font-weight:600; letter-spacing:.2px; }

    /* ── Sheets ──────────────────────────────────────────────────────────── */
    .sheet-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0); z-index:1000; display:none; align-items:flex-end; }
    .sheet-backdrop.open { display:flex; background:rgba(0,0,0,.45); backdrop-filter:blur(2px); }
    .sheet { background:var(--bg); width:100%; border-radius:24px 24px 0 0; padding:6px 20px 20px; padding-bottom:calc(20px + env(safe-area-inset-bottom)); max-height:92dvh; overflow-y:auto; animation:slideUp .26s var(--ease-out); box-shadow:var(--shadow-lg); }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .sheet-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:8px auto 16px; }
    .sheet-title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
    .sheet h2 { font-family:'Fraunces',serif; font-size:20px; font-weight:900; color:var(--amber-dark); }
    .sheet-close { border:none; background:var(--parchment); cursor:pointer; width:32px; height:32px; border-radius:50%; font-size:16px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
    .loc-chip { display:inline-flex; align-items:center; gap:6px; background:var(--amber-faint); color:var(--amber-dark); border:1px solid var(--border); border-radius:20px; padding:5px 12px; font-size:12px; font-weight:600; margin:8px 0 16px; }
    .form-divider { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:16px 0 10px; display:flex; align-items:center; gap:10px; }
    .form-divider::before, .form-divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .field { margin-bottom:13px; }
    .field label { display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:var(--text-2); text-transform:uppercase; letter-spacing:.4px; }
    .field input, .field textarea { width:100%; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; font-size:16px; background:var(--card); color:var(--text); font-family:'Inter',sans-serif; transition:border-color .2s ease, box-shadow .2s ease; }
    .field input:focus, .field textarea:focus { outline:none; border-color:var(--amber); box-shadow:0 0 0 3px rgba(200,130,30,.15); }
    .field textarea { resize:none; line-height:1.5; }
    .row2 { display:flex; gap:10px; }
    .row2 .field { flex:1; }
    .star-row { display:flex; align-items:center; gap:4px; }
    .star { font-size:30px; cursor:pointer; transition:transform .15s var(--ease-spring), opacity .15s ease; opacity:.28; filter:grayscale(1); line-height:1; }
    .star.on { opacity:1; filter:none; transform:scale(1.1); }
    .star:hover { transform:scale(1.2); }
    .geo-btn { width:100%; border:1.5px dashed var(--amber); background:var(--amber-faint); color:var(--amber-dark); border-radius:12px; padding:11px 14px; font-size:14px; font-weight:600; cursor:pointer; margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:6px; font-family:'Inter',sans-serif; transition:background .15s ease; }
    .geo-btn:hover { background:#FFF0CC; }
    .sheet-btns { display:flex; gap:10px; margin-top:10px; }
    .btn { flex:1; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; transition:transform .15s ease, opacity .15s ease; }
    .btn:active { transform:scale(.97); }
    .btn-primary { background:linear-gradient(135deg,var(--amber),var(--amber-dark)); color:#fff; box-shadow:0 4px 14px rgba(168,105,15,.35); }
    .btn-secondary { background:var(--parchment); color:var(--text-2); flex:0 0 auto; padding:15px 22px; border:1px solid var(--border); }
    .btn-danger { background:var(--danger); color:#fff; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn.full { flex:none; width:100%; margin-top:8px; }

    /* Members sheet */
    .room-member-list { display:flex; flex-direction:column; gap:8px; margin:12px 0; }
    .room-member-item { display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--parchment); border-radius:12px; }
    .room-member-avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:#fff; flex-shrink:0; }
    .room-member-name { font-size:14px; font-weight:600; flex:1; }
    .room-member-count { font-size:12px; color:var(--muted); }

    /* Delete confirm */
    .delete-confirm { position:fixed; inset:0; z-index:1100; display:none; align-items:flex-end; justify-content:center; padding:0 16px calc(24px + env(safe-area-inset-bottom)); background:rgba(0,0,0,.45); backdrop-filter:blur(2px); }
    .delete-confirm.open { display:flex; }
    .confirm-box { background:var(--card); border-radius:20px; width:100%; max-width:400px; padding:20px; box-shadow:var(--shadow-lg); animation:slideUp .22s var(--ease-out); }
    .confirm-title { font-family:'Fraunces',serif; font-size:17px; font-weight:700; margin-bottom:6px; }
    .confirm-sub { font-size:14px; color:var(--muted); margin-bottom:18px; line-height:1.4; }
    .confirm-btns { display:flex; gap:10px; }

    /* Toast */
    .toast { position:fixed; bottom:calc(70px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(8px); background:var(--text); color:var(--bg); padding:12px 22px; border-radius:28px; font-size:14px; font-weight:600; z-index:2000; box-shadow:var(--shadow-md); opacity:0; transition:opacity .25s ease, transform .25s var(--ease-spring); pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- ── SCREEN: Upiši ime (jedino što treba napraviti) ──────────────────── -->
<div id="screen-name" class="screen">
  <div class="screen-inner">
    <div class="screen-icon">🍺</div>
    <div class="screen-title">Pivska karta</div>
    <div class="screen-sub">Upiši ime da te prijatelji vide na karti.</div>

    <div class="name-avatar" id="name-avatar-preview" style="background:#C8821E">?</div>

    <div class="field" style="width:100%">
      <label>Tvoje ime</label>
      <input id="f-member-name" type="text" placeholder="npr. Marko" maxlength="20"
             autocomplete="given-name" autocorrect="off" spellcheck="false">
    </div>
    <button class="btn btn-primary full" id="btn-save-name" style="margin-top:4px">
      Ulazi u društvo 🍺
    </button>
  </div>
</div>

<div id="app" style="display:none">
  <header class="header">
    <div class="header-row">
      <div class="header-brand">
        <span class="header-icon">🍺</span>
        <h1>Pivska karta</h1>

</div>

<!-- ── Prijatelji sheet ────────────────────────────────────────────────── -->
<div class="sheet-backdrop" id="members-backdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>

    <button class="btn btn-secondary full" id="btn-change-name">Promijeni ime ✏️</button>

<!-- ── Add/edit sheet ──────────────────────────────────────────────────── -->
<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title-row">
      <h2 id="sheet-title">Nova piva 🍺</h2>
      <button class="sheet-close" id="sheet-close-btn">✕</button>
    </div>
    <div id="sheet-loc" class="loc-chip">📍 Tražim lokaciju…</div>
    <button class="geo-btn" id="geo-btn"><span>📍</span><span id="geo-btn-label">Koristi trenutnu lokaciju</span></button>
    <div class="form-divider">O pivi</div>
    <div class="field"><label for="f-beer">Koja piva? *</label><input id="f-beer" type="text" placeholder="npr. Ožujsko, Karlovačko, IPA…" autocomplete="off"></div>
    <div class="field"><label for="f-place">Lokal / mjesto</label><input id="f-place" type="text" placeholder="npr. Caffe bar Zagreb" autocomplete="off"></div>
    <div class="form-divider">Ocjena i cijena</div>
    <div class="row2">
      <div class="field">
        <label>Zvjezdice</label>
        <div class="star-row" id="star-pick">
          <span class="star" data-v="1">⭐</span><span class="star" data-v="2">⭐</span>
          <span class="star" data-v="3">⭐</span><span class="star" data-v="4">⭐</span>
          <span class="star" data-v="5">⭐</span>
        </div>
      </div>

<!-- ── Delete confirm ──────────────────────────────────────────────────── -->
<div class="delete-confirm" id="delete-confirm">
  <div class="confirm-box">
    <div class="confirm-title">Obrisati pivu?</div>
    <div class="confirm-sub" id="confirm-sub">Ova radnja se ne može poništiti.</div>
    <div class="confirm-btns">
      <button class="btn btn-secondary" id="confirm-cancel-btn" style="flex:1">Odustani</button>
      <button class="btn btn-danger" id="confirm-ok-btn" style="flex:1">Obriši</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Konstante ──────────────────────────────────────────────────────────────
const KEY_MEMBER = '@pivo_member';

const MEMBER_COLORS = [
  '#E53935','#1E88E5','#43A047','#8E24AA',
  '#FB8C00','#00897B','#F4511E','#6D4C41',
];

const DEFAULT_CENTER = [45.815, 15.982];

// Fiksna soba – svi s linkom automatski ulaze zajedno
const ROOM_ID = 'pivska-karta-nxrg-v1';

const GUN_PEERS = [
  'https://peer.wallie.io/gun',
  'https://gundb-relay-testing.glitch.me/gun',
];

// ── State ──────────────────────────────────────────────────────────────────
const S = {
  gun: null,
  gunRoom: null,
  memberId: null,
  memberName: null,
  memberColor: null,
  members: {},
  entries: [],
  filter: 'all',
  activeTab: 'map',
  editingName: false,
};

// ── Helpers ────────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(ts) { return new Date(ts).toLocaleDateString('hr-HR',{day:'numeric',month:'short',year:'numeric'}); }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString('hr-HR',{hour:'2-digit',minute:'2-digit'}); }
function starStr(n)  { return '⭐'.repeat(n)+'<span style="opacity:.2">⭐</span>'.repeat(5-n); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2500);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('visible'));
  document.getElementById('app').style.display = 'none';
  if (id === 'app') document.getElementById('app').style.display = 'flex';
  else document.getElementById(id)?.classList.add('visible');
}

// ── Gun init ───────────────────────────────────────────────────────────────
function initGun() {
  if (S.gun) return;
  S.gun = Gun(GUN_PEERS);
  S.gunRoom = S.gun.get('pivo-karta').get(ROOM_ID);
}

// ── Ekran za ime ───────────────────────────────────────────────────────────
function openNameScreen(editMode) {
  S.editingName = editMode;
  showScreen('screen-name');

  const usedColors = Object.values(S.members)
    .filter((_,i) => Object.keys(S.members)[i] !== S.memberId)
    .map(m => m.color);
  const previewColor = editMode && S.memberColor
    ? S.memberColor
    : (MEMBER_COLORS.find(c=>!usedColors.includes(c)) || MEMBER_COLORS[0]);

  const avatar = document.getElementById('name-avatar-preview');
  avatar.style.background = previewColor;
  avatar.textContent = (editMode && S.memberName ? S.memberName[0] : '?').toUpperCase();

  const inp = document.getElementById('f-member-name');
  inp.value = editMode ? (S.memberName||'') : '';
  inp.oninput = e => { avatar.textContent = (e.target.value[0]||'?').toUpperCase(); };
  setTimeout(()=>inp.focus(), 350);
}

document.getElementById('btn-save-name').addEventListener('click', () => {
  const name = document.getElementById('f-member-name').value.trim();
  if (!name) { toast('Upiši svoje ime'); return; }

  initGun();

  if (!S.memberId) {
    S.memberId = `${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
    const usedColors = Object.values(S.members).map(m=>m.color);
    S.memberColor = MEMBER_COLORS.find(c=>!usedColors.includes(c)) || MEMBER_COLORS[0];
  }

  S.memberName = name;
  S.gunRoom.get('members').get(S.memberId).put({
    name,
    color: S.memberColor,
    joined: S.members[S.memberId]?.joined || Date.now(),
  });
  localStorage.setItem(KEY_MEMBER, JSON.stringify({
    memberId: S.memberId,
    memberName: name,
    memberColor: S.memberColor,
  }));

  if (S.editingName) {
    showScreen('app');
    updateHeader();
    toast(`Ime promijenjeno u „${name}" ✓`);
  } else {
    enterApp();
  }
});

// ── Ulaz u aplikaciju ─────────────────────────────────────────────────────
function enterApp() {
  showScreen('app');
  updateHeader();
  if (!map) initMap();

  S.gunRoom.get('members').map().on((data, key) => {
    if (!key || key === '_') return;
    if (data && data.name) {
      S.members[key] = { name: data.name, color: data.color, joined: data.joined };
    } else if (!data) {
      delete S.members[key];
    }
    updateHeader();
    renderMapMarkers();
    if (S.activeTab === 'list')  renderList();
    if (S.activeTab === 'stats') renderStats();
  });

  S.gunRoom.get('entries').map().on((data, key) => {
    if (!key || key === '_') return;
    if (data && data.beer) {
      const entry = {
        id: key,
        beer: data.beer, place: data.place||'',
        rating: data.rating||0, price: data.price||'', note: data.note||'',
        lat: data.lat, lng: data.lng,
        memberId: data.memberId, memberName: data.memberName, memberColor: data.memberColor,
        ts: data.ts,
      };
      const idx = S.entries.findIndex(e=>e.id===key);
      if (idx >= 0) S.entries[idx] = entry; else S.entries.push(entry);
    } else {
      S.entries = S.entries.filter(e=>e.id!==key);
    }
    S.entries.sort((a,b)=>b.ts-a.ts);
    renderMapMarkers();
    if (S.activeTab === 'list')  renderList();
    if (S.activeTab === 'stats') renderStats();
  });
}

function updateHeader() {
  const hdr = document.getElementById('user-avatar-hdr');
  if (hdr && S.memberColor) {
    hdr.style.background = S.memberColor;
    hdr.textContent = (S.memberName||'?')[0].toUpperCase();
  }
  const membersEl = document.getElementById('header-members');
  if (!membersEl) return;
  const others = Object.entries(S.members).filter(([id])=>id!==S.memberId);
  membersEl.innerHTML = others.length
    ? others.map(([,m])=>`<span class="header-member-chip"><span class="header-member-dot" style="background:${m.color}"></span>${escapeHtml(m.name)}</span>`).join('')
    : '<span style="font-size:11px;color:var(--muted)">Pošalji link prijateljima da se pridruže</span>';
}

// ── Prijatelji sheet ───────────────────────────────────────────────────────
document.getElementById('user-btn').addEventListener('click', () => {
  const list = document.getElementById('members-list');
  const memberHtml = Object.entries(S.members).map(([id,m]) => {
    const cnt = S.entries.filter(e=>e.memberId===id).length;
    return `<div class="room-member-item">
      <div class="room-member-avatar" style="background:${m.color}">${m.name[0].toUpperCase()}</div>
      <div class="room-member-name">${escapeHtml(m.name)}${id===S.memberId?' (ti)':''}</div>
      <div class="room-member-count">${cnt}×</div>
    </div>`;
  }).join('');
  list.innerHTML = memberHtml || '<div style="text-align:center;padding:16px;color:var(--muted);font-size:14px">Još nema prijatelja — pošalji im link! 🍻</div>';
  document.getElementById('members-backdrop').classList.add('open');
});

document.getElementById('members-close').addEventListener('click', ()=>document.getElementById('members-backdrop').classList.remove('open'));
document.getElementById('members-backdrop').addEventListener('click', e=>{ if(e.target===e.currentTarget) document.getElementById('members-backdrop').classList.remove('open'); });
document.getElementById('btn-change-name').addEventListener('click', ()=>{
  document.getElementById('members-backdrop').classList.remove('open');
  openNameScreen(true);
});

// ── Karta ──────────────────────────────────────────────────────────────────
let map, markers = {}, tempMarker = null;

function memberIcon(name, color) {
  return L.divIcon({
    className:'',
    html:`<div class="member-pin" style="background:${color}">${(name||'?')[0].toUpperCase()}</div>`,
    iconSize:[32,32], iconAnchor:[16,16], popupAnchor:[0,-18],
  });
}

function initMap() {
  if (map) return;
  map = L.map('map',{zoomControl:true}).setView(DEFAULT_CENTER, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  renderMapMarkers();
  fitToEntries();
}

function renderMapMarkers() {
  if (!map) return;
  Object.values(markers).forEach(m=>map.removeLayer(m));
  markers = {};
  const legend = document.getElementById('map-legend');
  S.entries.forEach(e=>addMapMarker(e));
  const legendItems = Object.entries(S.members).map(([id,m])=>{
    const cnt = S.entries.filter(e=>e.memberId===id).length;
    return cnt>0?`<div class="legend-item"><div class="legend-dot" style="background:${m.color}"></div><span>${escapeHtml(m.name)}</span><span style="color:var(--muted);margin-left:4px">${cnt}×</span></div>`:'';
  }).filter(Boolean).join('');
  if (legendItems) { legend.innerHTML=legendItems; legend.classList.add('visible'); }
  else legend.classList.remove('visible');
}

function addMapMarker(e) {
  if (!e.lat||!e.lng) return;
  const icon = S.members[e.memberId]
    ? memberIcon(e.memberName||'?', e.memberColor||'#C8821E')
    : L.divIcon({className:'',html:'<div class="beer-pin">🍺</div>',iconSize:[32,32],iconAnchor:[16,30],popupAnchor:[0,-28]});
  const m = L.marker([e.lat,e.lng],{icon}).addTo(map);
  m.bindPopup(popupHtml(e),{maxWidth:220});
  markers[e.id] = m;
}

function popupHtml(e) {
  const memberLine = e.memberName
    ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:${e.memberColor||'var(--amber)'};margin-bottom:4px">${escapeHtml(e.memberName)}</div>`
    : '';
  return `${memberLine}<b>${escapeHtml(e.beer)}</b><br>
    ${e.place?`<span style="color:var(--muted);font-size:12px">📍 ${escapeHtml(e.place)}</span><br>`:''}
    <span style="font-size:13px">${starStr(e.rating||0)}</span><br>
    <span style="color:#9A876A;font-size:11px">${fmtDate(e.ts)}${e.price?' · 💶 '+e.price+' €':''}</span>
    ${e.note?`<br><em style="font-size:12px;color:#6B5030">${escapeHtml(e.note)}</em>`:''}`;
}

function fitToEntries() {
  if (!S.entries.length) return;
  map.fitBounds(L.latLngBounds(S.entries.map(e=>[e.lat,e.lng])),{padding:[50,50],maxZoom:16});
}

// ── Filter ─────────────────────────────────────────────────────────────────
function buildFilterRow() {
  const pills = [`<button class="filter-pill ${S.filter==='all'?'active':''}" data-filter="all">Svi · ${S.entries.length}</button>`];
  Object.entries(S.members).forEach(([id,m])=>{
    const cnt = S.entries.filter(e=>e.memberId===id).length;
    pills.push(`<button class="filter-pill ${S.filter===id?'active':''}" data-filter="${id}">
      <span class="filter-pill-dot" style="background:${m.color}"></span>${escapeHtml(m.name)} · ${cnt}
    </button>`);
  });
  return `<div class="filter-row">${pills.join('')}</div>`;
}

function bindFilterPills(el) {
  el.querySelectorAll('.filter-pill').forEach(btn=>btn.addEventListener('click',()=>{ S.filter=btn.dataset.filter; renderList(); }));
}

// ── Lista ──────────────────────────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('tab-list');
  let entries = S.filter==='all' ? S.entries : S.entries.filter(e=>e.memberId===S.filter);
  const filterHtml = buildFilterRow();
  if (!entries.length) {
    el.innerHTML = filterHtml+`<div class="empty-state"><div class="empty-icon-wrap">🍺</div><div class="empty-text">Još nema piva</div><div class="empty-hint">Idi na „Karta" i pritisni ＋</div></div>`;
    bindFilterPills(el); return;
  }
  const cardsHtml = entries.map(e=>{
    const member = S.members[e.memberId];
    const color  = member ? member.color : 'var(--amber)';
    const isOwn  = e.memberId===S.memberId;
    return `<div class="card">
      <div class="card-stripe" style="background:linear-gradient(180deg,${color},${color}88)"></div>
      <div class="card-emoji">🍺</div>
      <div class="card-body" data-goto="${e.id}">
        ${member?`<div class="card-member-name" style="color:${color}">${escapeHtml(member.name)}</div>`:''}
        <div class="card-beer">${escapeHtml(e.beer)}</div>
        ${e.place?`<div class="card-place">📍 ${escapeHtml(e.place)}</div>`:''}
        ${e.rating?`<div class="card-stars">${starStr(e.rating)}</div>`:''}
        ${e.note?`<div class="card-note">„${escapeHtml(e.note)}"</div>`:''}
        <div class="card-meta"><span>🗓 ${fmtDate(e.ts)} · ${fmtTime(e.ts)}</span>${e.price?`<span>💶 ${escapeHtml(e.price)} €</span>`:''}</div>
      </div>
      <div class="card-actions">${isOwn?`<button class="icon-btn" data-edit="${e.id}">✏️</button><button class="icon-btn del" data-delete="${e.id}">🗑️</button>`:''}</div>
    </div>`;
  }).join('');
  el.innerHTML = filterHtml+`<div class="list">${cardsHtml}</div>`;
  bindFilterPills(el);
  el.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>goToOnMap(b.dataset.goto)));
  el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();editEntry(b.dataset.edit);}));
  el.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();deleteEntry(b.dataset.delete);}));
}

function goToOnMap(id) {
  const e = S.entries.find(x=>x.id===id);
  if (!e) return;
  showTab('map');
  map.setView([e.lat,e.lng],17);
  if (markers[id]) markers[id].openPopup();
}

// ── Statistike ─────────────────────────────────────────────────────────────
function renderStats() {
  const el = document.getElementById('tab-stats');
  const all = S.entries;
  if (!all.length) {
    el.innerHTML=`<div class="empty-state"><div class="empty-icon-wrap">📊</div><div class="empty-text">Nema podataka</div><div class="empty-hint">Dodaj barem jednu pivu pa se vrati ovamo</div></div>`;
    return;
  }
  function statsFor(list) {
    const rated=list.filter(e=>e.rating>0);
    const spent=list.reduce((a,e)=>a+(parseFloat(e.price)||0),0);
    return { total:list.length, places:new Set(list.map(e=>(e.place||'').toLowerCase().trim()).filter(Boolean)).size, avg:rated.length?rated.reduce((a,e)=>a+e.rating,0)/rated.length:0, spent };
  }
  const g = statsFor(all);
  const counts = {};
  all.forEach(e=>{ const k=e.beer.trim(); if(!counts[k]) counts[k]={name:k,n:0}; counts[k].n++; });
  const top  = Object.values(counts).sort((a,b)=>b.n-a.n).slice(0,6);
  const maxN = Math.max(...top.map(t=>t.n),1);
  const medals = ['🥇','🥈','🥉'];
  const rankHtml = `<div class="section-title">Najčešće pive</div>
    <div class="rank-card">${top.map((t,i)=>`<div class="rank-row">
      <div class="rank-pos">${medals[i]||(i+1)+'.'}</div>
      <div class="rank-name">${escapeHtml(t.name)}</div>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${(t.n/maxN)*100}%"></div></div>
      <div class="rank-count">${t.n}×</div>
    </div>`).join('')}</div>`;
  let personHtml = '';
  if (Object.keys(S.members).length > 1) {
    personHtml = '<div class="section-title">Po osobi</div>';
    Object.entries(S.members).forEach(([mid,m])=>{
      const mE=all.filter(e=>e.memberId===mid);
      if (!mE.length) return;
      const ms=statsFor(mE);
      personHtml+=`<div class="person-section">
        <div class="person-header">
          <div class="person-avatar" style="background:${m.color}">${m.name[0].toUpperCase()}</div>
          <div class="person-name">${escapeHtml(m.name)}</div>
          <div class="person-count">${ms.total} piv${ms.total===1?'a':'e'}</div>
        </div>
        <div class="person-stats">
          <div class="person-stat"><div class="person-stat-val">${ms.total}</div><div class="person-stat-lbl">Ukupno</div></div>
          <div class="person-stat"><div class="person-stat-val">${ms.avg?ms.avg.toFixed(1)+'★':'—'}</div><div class="person-stat-lbl">Ocjena</div></div>
          <div class="person-stat"><div class="person-stat-val">${ms.spent?ms.spent.toFixed(2)+' €':'—'}</div><div class="person-stat-lbl">Potrošio</div></div>
        </div>
      </div>`;
    });
  }
  el.innerHTML=`<div class="stats-content">
    <div class="stats-header">Statistike društva 📊</div>
    <div class="summary-grid">
      <div class="summary-card"><div class="summary-icon">🍺</div><div class="summary-value">${g.total}</div><div class="summary-label">Ukupno</div></div>
      <div class="summary-card"><div class="summary-icon">📍</div><div class="summary-value">${g.places||'—'}</div><div class="summary-label">Lokacija</div></div>
      <div class="summary-card"><div class="summary-icon">⭐</div><div class="summary-value">${g.avg?g.avg.toFixed(1):'—'}</div><div class="summary-label">Ocjena</div></div>
    </div>
    ${g.spent>0?`<div class="summary-grid col2">
      <div class="summary-card"><div class="summary-icon">💸</div><div class="summary-value">${g.spent.toFixed(2)} €</div><div class="summary-label">Potrošeno</div></div>
      <div class="summary-card"><div class="summary-icon">💶</div><div class="summary-value">${(g.spent/g.total).toFixed(2)} €</div><div class="summary-label">Prosj./piva</div></div>
    </div>`:''}
    ${rankHtml}
    ${personHtml}
  </div>`;
}

// ── Dodaj / uredi unos ─────────────────────────────────────────────────────
let pendingLoc = null, editingId = null, currentRating = 0;

document.getElementById('fab-add').addEventListener('click', startAdd);

function startAdd() {
  editingId = null;
  document.getElementById('sheet-title').textContent = 'Nova piva 🍺';
  ['f-beer','f-place','f-price','f-note'].forEach(id=>document.getElementById(id).value='');
  setStars(0);
  const c = map.getCenter();
  setTempLoc(c.lat, c.lng);
  openSheet();
  useGeo(true);
}

function setTempLoc(lat, lng) {
  pendingLoc = {lat,lng};
  if (tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.marker([lat,lng],{icon:memberIcon(S.memberName||'?',S.memberColor||'#C8821E'),opacity:.7,draggable:true}).addTo(map);
  tempMarker.on('dragend',()=>{ const p=tempMarker.getLatLng(); pendingLoc={lat:p.lat,lng:p.lng}; updateLocChip(); });
  updateLocChip();
}

function updateLocChip() {
  const el=document.getElementById('sheet-loc');
  if (pendingLoc) el.innerHTML=`📍 ${pendingLoc.lat.toFixed(5)}, ${pendingLoc.lng.toFixed(5)} <span style="color:var(--muted);font-weight:400">· povuci pin</span>`;
  else el.textContent='📍 Lokacija nije odabrana';
}

function useGeo(silent) {
  if (!navigator.geolocation) { if(!silent) toast('Geolokacija nije dostupna'); return; }
  const lbl=document.getElementById('geo-btn-label');
  lbl.textContent='Tražim lokaciju…';
  navigator.geolocation.getCurrentPosition(
    pos=>{ lbl.textContent='Koristi trenutnu lokaciju'; setTempLoc(pos.coords.latitude,pos.coords.longitude); map.setView([pos.coords.latitude,pos.coords.longitude],16); },
    ()=>{ lbl.textContent='Koristi trenutnu lokaciju'; if(!silent) toast('Ne mogu dohvatiti lokaciju'); },
    {enableHighAccuracy:true,timeout:8000,maximumAge:60000}
  );
}

function setStars(n) {
  currentRating=n;
  document.querySelectorAll('#star-pick .star').forEach(s=>s.classList.toggle('on',Number(s.dataset.v)<=n));
}
document.querySelectorAll('#star-pick .star').forEach(s=>s.addEventListener('click',()=>setStars(Number(s.dataset.v)===currentRating?0:Number(s.dataset.v))));

function openSheet()  { document.getElementById('sheet-backdrop').classList.add('open'); setTimeout(()=>document.getElementById('f-beer').focus(),300); }
function closeSheet() {
  document.getElementById('sheet-backdrop').classList.remove('open');
  if (tempMarker) { map.removeLayer(tempMarker); tempMarker=null; }
  editingId=null;
}
document.getElementById('sheet-backdrop').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeSheet(); });
document.getElementById('sheet-close-btn').addEventListener('click',closeSheet);
document.getElementById('sheet-cancel-btn').addEventListener('click',closeSheet);
document.getElementById('geo-btn').addEventListener('click',()=>useGeo(false));

document.getElementById('save-btn').addEventListener('click',()=>{
  const beer=document.getElementById('f-beer').value.trim();
  if (!beer) { toast('Upiši koju si pivu popio'); document.getElementById('f-beer').focus(); return; }
  if (!pendingLoc) { toast('Odaberi lokaciju na karti'); return; }
  const data={beer,place:document.getElementById('f-place').value.trim(),rating:currentRating,price:document.getElementById('f-price').value.trim(),note:document.getElementById('f-note').value.trim(),lat:pendingLoc.lat,lng:pendingLoc.lng};
  if (editingId) {
    S.gunRoom.get('entries').get(editingId).put(data);
    toast('Spremljeno ✓');
  } else {
    const id=`e${Date.now()}${Math.random().toString(36).slice(2,5)}`;
    S.gunRoom.get('entries').get(id).put({...data,memberId:S.memberId,memberName:S.memberName,memberColor:S.memberColor,ts:Date.now()});
    toast('Živjeli! 🍻');
  }
  if (tempMarker) { map.removeLayer(tempMarker); tempMarker=null; }
  closeSheet();
});

function editEntry(id) {
  const e=S.entries.find(x=>x.id===id);
  if (!e) return;
  editingId=id;
  document.getElementById('sheet-title').textContent='Uredi pivu ✏️';
  document.getElementById('f-beer').value=e.beer||'';
  document.getElementById('f-place').value=e.place||'';
  document.getElementById('f-price').value=e.price||'';
  document.getElementById('f-note').value=e.note||'';
  setStars(e.rating||0);
  showTab('map');
  map.setView([e.lat,e.lng],16);
  setTempLoc(e.lat,e.lng);
  openSheet();
}

// ── Brisanje ───────────────────────────────────────────────────────────────
let pendingDeleteId = null;
function deleteEntry(id) {
  const e=S.entries.find(x=>x.id===id);
  if (!e) return;
  pendingDeleteId=id;
  document.getElementById('confirm-sub').textContent=`„${e.beer}" bit će trajno obrisan.`;
  document.getElementById('delete-confirm').classList.add('open');
}
document.getElementById('confirm-cancel-btn').addEventListener('click',()=>{ document.getElementById('delete-confirm').classList.remove('open'); pendingDeleteId=null; });
document.getElementById('confirm-ok-btn').addEventListener('click',()=>{
  if (!pendingDeleteId) return;
  document.getElementById('delete-confirm').classList.remove('open');
  if (markers[pendingDeleteId]) { map.removeLayer(markers[pendingDeleteId]); delete markers[pendingDeleteId]; }
  S.gunRoom.get('entries').get(pendingDeleteId).put(null);
  pendingDeleteId=null;
  toast('Obrisano 🗑️');
});

// ── Tabovi ─────────────────────────────────────────────────────────────────
function showTab(tab) {
  S.activeTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.id===`tab-${tab}`));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  if (tab==='list')  renderList();
  if (tab==='stats') renderStats();
  if (tab==='map'&&map) setTimeout(()=>map.invalidateSize(),100);
}
document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>showTab(btn.dataset.tab)));

// ── Init ───────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY_MEMBER)); } catch { return null; } })();
  if (saved && saved.memberId && saved.memberName) {
    S.memberId    = saved.memberId;
    S.memberName  = saved.memberName;
    S.memberColor = saved.memberColor;
    initGun();
    enterApp();
  } else {
    openNameScreen(false);
  }
});
</script>
