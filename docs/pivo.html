<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pivska karta">
  <meta name="theme-color" content="#C8821E">
  <link rel="manifest" href="pivo-manifest.json">
  <title>Pivska karta 🍺</title>

  <!-- Fonts: Fraunces (display) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    /* ── Reset & tokens ──────────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      /* Brand */
      --amber:       #C8821E;
      --amber-dark:  #A9690F;
      --amber-light: #F5C96A;
      --amber-faint: #FFF3DC;
      --gold:        #E8B23A;

      /* Neutrals */
      --cream:   #FFF8EC;
      --parchment: #F5EDD8;
      --border:  #E8DBCC;
      --muted:   #9A876A;
      --text:    #2C1A07;
      --text-2:  #6B5030;
      --white:   #FFFFFF;

      /* Semantic */
      --danger:  #D93B3B;
      --success: #3A8C5C;

      /* Elevation */
      --shadow-sm: 0 1px 4px rgba(80,50,10,.08);
      --shadow-md: 0 4px 16px rgba(80,50,10,.12);
      --shadow-lg: 0 8px 32px rgba(80,50,10,.18);

      /* Motion */
      --ease-spring: cubic-bezier(.34,1.56,.64,1);
      --ease-out:    cubic-bezier(.22,.61,.36,1);

      /* Surfaces */
      --bg:   var(--cream);
      --card: var(--white);
      --nav-bg: var(--white);
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --amber:       #E09A38;
        --amber-dark:  #C8821E;
        --amber-light: #F5C96A;
        --amber-faint: #2A1A00;
        --gold:        #D4A030;
        --cream:   #1A1008;
        --parchment: #241608;
        --border:  #3A2810;
        --muted:   #8A7060;
        --text:    #F0E0C8;
        --text-2:  #C0A080;
        --white:   #FFFFFF;
        --bg:      #1A1008;
        --card:    #241608;
        --nav-bg:  #1E1208;
        --shadow-sm: 0 1px 4px rgba(0,0,0,.3);
        --shadow-md: 0 4px 16px rgba(0,0,0,.4);
        --shadow-lg: 0 8px 32px rgba(0,0,0,.5);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* ── Base ────────────────────────────────────────────────────────────── */
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #app { display: flex; flex-direction: column; height: 100dvh; }

    /* ── Header ──────────────────────────────────────────────────────────── */
    .header {
      background: linear-gradient(160deg, var(--cream) 0%, var(--parchment) 100%);
      padding: 14px 20px 12px;
      padding-top: calc(14px + env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      text-align: center;
      z-index: 500;
      position: relative;
    }

    .header-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header-icon {
      font-size: 26px;
      animation: sway 3s ease-in-out infinite;
      display: inline-block;
      transform-origin: bottom center;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-4deg); }
      50%       { transform: rotate(4deg);  }
    }

    .header h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 22px;
      font-weight: 900;
      color: var(--amber);
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .header-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.3px;
      font-weight: 500;
    }

    /* ── Main + tabs ─────────────────────────────────────────────────────── */
    .main { flex: 1; overflow: hidden; position: relative; }

    .tab { display: none; height: 100%; }
    .tab.active { display: block; }
    .tab.scrolly { overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* ── Map ─────────────────────────────────────────────────────────────── */
    #map { height: 100%; width: 100%; background: var(--parchment); }

    /* Leaflet popup */
    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      box-shadow: var(--shadow-lg) !important;
      border: 1px solid var(--border);
    }
    .leaflet-popup-content {
      margin: 14px 16px !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 14px !important;
      line-height: 1.5 !important;
    }
    .leaflet-popup-content b {
      font-family: 'Fraunces', serif;
      font-size: 16px;
      color: var(--amber-dark);
    }
    .leaflet-popup-tip-container { filter: drop-shadow(0 2px 4px rgba(0,0,0,.1)); }

    .beer-pin {
      font-size: 28px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.35));
      text-align: center;
      line-height: 1;
      transition: transform .15s var(--ease-spring);
    }
    .beer-pin:hover { transform: scale(1.15); }

    /* FAB */
    .fab {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 58px; height: 58px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--amber) 0%, var(--amber-dark) 100%);
      color: #fff;
      border: none;
      font-size: 28px;
      font-weight: 300;
      box-shadow: 0 6px 20px rgba(168,105,15,.5), 0 2px 6px rgba(168,105,15,.3);
      cursor: pointer;
      z-index: 600;
      display: flex; align-items: center; justify-content: center;
      transition: transform .18s var(--ease-spring), box-shadow .18s ease;
    }
    .fab:hover  { transform: scale(1.08); box-shadow: 0 10px 28px rgba(168,105,15,.55); }
    .fab:active { transform: scale(0.92); }

    .map-hint {
      position: absolute;
      top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(44,26,7,.9);
      color: #fff;
      padding: 9px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      z-index: 600;
      white-space: nowrap;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(6px);
    }

    /* ── Bottom nav ──────────────────────────────────────────────────────── */
    .nav {
      display: flex;
      background: var(--nav-bg);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
      position: relative;
    }

    .nav-btn {
      flex: 1;
      border: none;
      background: none;
      padding: 10px 8px 8px;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: color .2s ease;
      position: relative;
    }

    .nav-btn.active { color: var(--amber); }

    .nav-btn.active::after {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 32px; height: 3px;
      background: var(--amber);
      border-radius: 0 0 3px 3px;
      animation: indicatorIn .22s var(--ease-spring);
    }

    @keyframes indicatorIn {
      from { width: 0; opacity: 0; }
      to   { width: 32px; opacity: 1; }
    }

    .nav-icon { font-size: 20px; }
    .nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.2px; }

    /* ── List ────────────────────────────────────────────────────────────── */
    .list {
      padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      padding-bottom: 32px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 14px 14px 0;
      box-shadow: var(--shadow-sm);
      display: flex;
      gap: 0;
      align-items: flex-start;
      overflow: hidden;
      transition: box-shadow .2s ease, transform .2s ease;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .card:active { transform: translateY(0); }

    /* left amber accent stripe */
    .card-stripe {
      width: 4px;
      align-self: stretch;
      min-height: 56px;
      background: linear-gradient(180deg, var(--amber) 0%, var(--gold) 100%);
      border-radius: 0 2px 2px 0;
      flex-shrink: 0;
      margin-right: 12px;
    }

    .card-emoji {
      font-size: 28px;
      line-height: 1;
      flex-shrink: 0;
      margin-right: 10px;
      margin-top: 1px;
    }

    .card-body { flex: 1; min-width: 0; }
    .card-beer { font-size: 15px; font-weight: 700; line-height: 1.3; }

    .card-place {
      font-size: 12px; color: var(--muted); margin-top: 3px;
      display: flex; align-items: center; gap: 3px; font-weight: 500;
    }

    .card-stars { font-size: 13px; margin-top: 6px; letter-spacing: 1px; }

    .card-note {
      font-size: 12px; color: var(--text-2); margin-top: 5px;
      font-style: italic; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .card-meta {
      font-size: 11px; color: var(--muted); margin-top: 6px;
      display: flex; gap: 10px; flex-wrap: wrap; font-weight: 500;
    }

    .card-actions {
      display: flex; flex-direction: column; gap: 4px;
      align-items: flex-end; flex-shrink: 0; margin-left: 6px;
    }

    .icon-btn {
      border: none; background: none; cursor: pointer;
      font-size: 16px; padding: 6px; border-radius: 8px;
      transition: background .15s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: var(--parchment); }
    .icon-btn.del { color: var(--danger); }

    /* Empty state */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; padding: 40px 32px; gap: 12px; text-align: center;
    }
    .empty-icon-wrap {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--amber-faint);
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; margin-bottom: 4px;
      border: 2px dashed var(--border);
    }
    .empty-text { font-size: 17px; font-weight: 700; color: var(--text); font-family: 'Fraunces', serif; }
    .empty-hint { font-size: 13px; color: var(--muted); line-height: 1.5; max-width: 240px; }

    /* ── Stats ───────────────────────────────────────────────────────────── */
    .stats-content {
      padding: 16px;
      display: flex; flex-direction: column; gap: 16px;
      padding-bottom: 36px;
    }

    .stats-header {
      font-family: 'Fraunces', serif;
      font-size: 18px; font-weight: 900;
      color: var(--amber-dark);
      padding: 4px 0 0;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .summary-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 10px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }

    .summary-icon { font-size: 20px; }
    .summary-label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-value { font-size: 22px; font-weight: 800; color: var(--amber); font-family: 'Fraunces', serif; line-height: 1; }

    .summary-2col { grid-template-columns: 1fr 1fr; }

    .section-title {
      font-size: 13px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-top: 4px;
    }

    .rank-card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .rank-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      transition: background .15s ease;
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-row:hover { background: var(--amber-faint); }

    .rank-pos { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
    .rank-name { flex: 1; font-size: 14px; font-weight: 600; }
    .rank-bar-wrap { flex: 1.5; height: 7px; background: var(--parchment); border-radius: 4px; overflow: hidden; }
    .rank-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--amber) 0%, var(--gold) 100%);
      border-radius: 4px;
      width: 0;
      animation: barFill .6s var(--ease-out) forwards;
    }
    @keyframes barFill { from { width: 0; } }
    .rank-count { font-size: 13px; font-weight: 700; color: var(--amber); width: 28px; text-align: right; }

    /* ── Bottom sheet / form ─────────────────────────────────────────────── */
    .sheet-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0);
      z-index: 1000;
      display: none; align-items: flex-end;
      transition: background .25s ease;
    }
    .sheet-backdrop.open {
      display: flex;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(2px);
    }

    .sheet {
      background: var(--bg);
      width: 100%;
      border-radius: 24px 24px 0 0;
      padding: 6px 20px 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      max-height: 92dvh;
      overflow-y: auto;
      animation: slideUp .26s var(--ease-out);
      box-shadow: var(--shadow-lg);
    }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .sheet-handle {
      width: 36px; height: 4px;
      background: var(--border); border-radius: 2px;
      margin: 8px auto 16px;
    }

    .sheet-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }

    .sheet h2 {
      font-family: 'Fraunces', serif;
      font-size: 20px; font-weight: 900;
      color: var(--amber-dark);
    }

    .sheet-close {
      border: none; background: var(--parchment); cursor: pointer;
      width: 32px; height: 32px; border-radius: 50%;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      color: var(--muted); transition: background .15s ease;
    }
    .sheet-close:hover { background: var(--border); }

    .loc-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--amber-faint); color: var(--amber-dark);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 12px;
      font-size: 12px; font-weight: 600;
      margin-bottom: 16px; margin-top: 8px;
    }

    .form-divider {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin: 16px 0 10px; display: flex; align-items: center; gap: 10px;
    }
    .form-divider::before, .form-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .field { margin-bottom: 13px; }

    .field label {
      display: block; font-size: 12px; font-weight: 700;
      margin-bottom: 6px; color: var(--text-2);
      text-transform: uppercase; letter-spacing: 0.4px;
    }

    .field input, .field textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      background: var(--card);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .field input:focus, .field textarea:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(200,130,30,.15);
    }
    .field textarea { resize: none; line-height: 1.5; }

    .row2 { display: flex; gap: 10px; }
    .row2 .field { flex: 1; }

    /* Star rating */
    .star-row { display: flex; align-items: center; gap: 4px; }
    .star {
      font-size: 30px; cursor: pointer;
      transition: transform .15s var(--ease-spring), opacity .15s ease;
      opacity: .28; filter: grayscale(1);
      line-height: 1;
    }
    .star.on { opacity: 1; filter: none; transform: scale(1.1); }
    .star:hover { transform: scale(1.2); }

    /* Geo button */
    .geo-btn {
      width: 100%;
      border: 1.5px dashed var(--amber);
      background: var(--amber-faint);
      color: var(--amber-dark);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; margin-bottom: 14px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-family: 'Inter', sans-serif;
      transition: background .15s ease, border-color .15s ease;
    }
    .geo-btn:hover  { background: #FFF0CC; border-color: var(--amber-dark); }
    .geo-btn:active { background: #FFE8AA; }

    /* Sheet buttons */
    .sheet-btns { display: flex; gap: 10px; margin-top: 10px; }

    .btn {
      flex: 1; border: none; border-radius: 14px;
      padding: 15px; font-size: 16px; font-weight: 700;
      cursor: pointer; font-family: 'Inter', sans-serif;
      transition: transform .15s ease, opacity .15s ease;
    }
    .btn:active { transform: scale(.97); }

    .btn-save {
      background: linear-gradient(135deg, var(--amber) 0%, var(--amber-dark) 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(168,105,15,.35);
    }
    .btn-save:hover { box-shadow: 0 6px 18px rgba(168,105,15,.45); }
    .btn-save:disabled { opacity: .5; cursor: not-allowed; }

    .btn-cancel {
      background: var(--parchment);
      color: var(--text-2);
      flex: 0 0 auto;
      padding: 15px 22px;
      border: 1px solid var(--border);
    }

    /* ── Delete confirm (custom inline) ─────────────────────────────────── */
    .delete-confirm {
      position: fixed; inset: 0;
      z-index: 1100;
      display: none; align-items: flex-end; justify-content: center;
      padding: 0 16px calc(24px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(2px);
    }
    .delete-confirm.open { display: flex; }

    .confirm-box {
      background: var(--card);
      border-radius: 20px;
      width: 100%; max-width: 400px;
      padding: 20px;
      box-shadow: var(--shadow-lg);
      animation: slideUp .22s var(--ease-out);
    }
    .confirm-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .confirm-sub { font-size: 14px; color: var(--muted); margin-bottom: 18px; line-height: 1.4; }
    .confirm-btns { display: flex; gap: 10px; }
    .btn-danger { background: var(--danger); color: #fff; }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: calc(70px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%) translateY(8px);
      background: var(--text); color: var(--bg);
      padding: 12px 22px; border-radius: 28px;
      font-size: 14px; font-weight: 600;
      z-index: 2000; box-shadow: var(--shadow-md);
      opacity: 0; transition: opacity .25s ease, transform .25s var(--ease-spring);
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-brand">
      <span class="header-icon">🍺</span>
      <h1>Pivska karta</h1>
    </div>
    <div class="header-sub">gdje sam bio · što sam pio</div>
  </header>

  <main class="main">
    <!-- Map tab -->
    <div id="tab-map" class="tab active">
      <div id="map"></div>
      <div class="map-hint" id="map-hint" style="display:none;"></div>
      <button class="fab" id="fab-add" aria-label="Dodaj pivu">＋</button>
    </div>

    <!-- List tab -->
    <div id="tab-list" class="tab scrolly"></div>

    <!-- Stats tab -->
    <div id="tab-stats" class="tab scrolly"></div>
  </main>

  <nav class="nav">
    <button class="nav-btn active" data-tab="map">
      <span class="nav-icon">🗺️</span>
      <span class="nav-label">Karta</span>
    </button>
    <button class="nav-btn" data-tab="list">
      <span class="nav-icon">📋</span>
      <span class="nav-label">Lista</span>
    </button>
    <button class="nav-btn" data-tab="stats">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Statistike</span>
    </button>
  </nav>
</div>

<!-- Add / edit sheet -->
<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-title-row">
      <h2 id="sheet-title">Nova piva 🍺</h2>
      <button class="sheet-close" id="sheet-close-btn" aria-label="Zatvori">✕</button>
    </div>

    <div id="sheet-loc" class="loc-chip">📍 Tražim lokaciju…</div>

    <button class="geo-btn" id="geo-btn">
      <span>📍</span> <span id="geo-btn-label">Koristi trenutnu lokaciju</span>
    </button>

    <div class="form-divider">O pivi</div>

    <div class="field">
      <label for="f-beer">Koja piva? *</label>
      <input id="f-beer" type="text" placeholder="npr. Ožujsko, Karlovačko, IPA…" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-place">Lokal / mjesto</label>
      <input id="f-place" type="text" placeholder="npr. Caffe bar Zagreb" autocomplete="off">
    </div>

    <div class="form-divider">Ocjena i cijena</div>

    <div class="row2">
      <div class="field">
        <label>Zvjezdice</label>
        <div class="star-row" id="star-pick">
          <span class="star" data-v="1">⭐</span>
          <span class="star" data-v="2">⭐</span>
          <span class="star" data-v="3">⭐</span>
          <span class="star" data-v="4">⭐</span>
          <span class="star" data-v="5">⭐</span>
        </div>
      </div>
      <div class="field">
        <label for="f-price">Cijena (€)</label>
        <input id="f-price" type="number" inputmode="decimal" step="0.10" placeholder="2.50">
      </div>
    </div>

    <div class="field">
      <label for="f-note">Bilješka</label>
      <textarea id="f-note" rows="2" placeholder="Kakva je bila? S kim si bio?"></textarea>
    </div>

    <div class="sheet-btns">
      <button class="btn btn-cancel" id="sheet-cancel-btn">Odustani</button>
      <button class="btn btn-save" id="save-btn">Spremi</button>
    </div>
  </div>
</div>

<!-- Custom delete confirm -->
<div class="delete-confirm" id="delete-confirm">
  <div class="confirm-box">
    <div class="confirm-title">Obrisati pivu?</div>
    <div class="confirm-sub" id="confirm-sub">Ova radnja se ne može poništiti.</div>
    <div class="confirm-btns">
      <button class="btn btn-cancel" id="confirm-cancel-btn" style="flex:1">Odustani</button>
      <button class="btn btn-danger" id="confirm-ok-btn" style="flex:1">Obriši</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Storage ────────────────────────────────────────────────────────────────
const DB_KEY = '@pivo_log';
const db = {
  all() {
    try { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); }
    catch { return []; }
  },
  save(list) { localStorage.setItem(DB_KEY, JSON.stringify(list)); },
  add(entry) { this.save([entry, ...this.all()]); },
  update(id, patch) {
    this.save(this.all().map(e => e.id === id ? { ...e, ...patch } : e));
  },
  remove(id) { this.save(this.all().filter(e => e.id !== id)); },
};

// ── Helpers ────────────────────────────────────────────────────────────────
const DEFAULT_CENTER = [45.8150, 15.9819]; // Zagreb

function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('hr-HR', { day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('hr-HR', { hour: '2-digit', minute: '2-digit' });
}
function starStr(n) {
  return '<span style="color:#E8B23A">⭐</span>'.repeat(n) +
         '<span style="opacity:.25">⭐</span>'.repeat(5 - n);
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])
  );
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ── Map ────────────────────────────────────────────────────────────────────
let map, markers = {}, tempMarker = null;

const beerIcon = L.divIcon({
  className: '',
  html: '<div class="beer-pin">🍺</div>',
  iconSize: [32, 32],
  iconAnchor: [16, 30],
  popupAnchor: [0, -28],
});

function initMap() {
  map = L.map('map', { zoomControl: true, attributionControl: true })
          .setView(DEFAULT_CENTER, 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
  }).addTo(map);

  renderMarkers();
  fitToEntries();
}

function renderMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  db.all().forEach(e => addMarker(e));
}

function addMarker(e) {
  const m = L.marker([e.lat, e.lng], { icon: beerIcon }).addTo(map);
  m.bindPopup(popupHtml(e), { maxWidth: 220 });
  markers[e.id] = m;
}

function popupHtml(e) {
  return `
    <b>${escapeHtml(e.beer)}</b><br>
    ${e.place ? `<span style="color:var(--muted);font-size:12px">📍 ${escapeHtml(e.place)}</span><br>` : ''}
    <span style="font-size:13px">${starStr(e.rating || 0)}</span><br>
    <span style="color:#9A876A;font-size:11px">${fmtDate(e.ts)}${e.price ? ' · 💶 ' + e.price + ' €' : ''}</span>
    ${e.note ? `<br><em style="font-size:12px;color:#6B5030">${escapeHtml(e.note)}</em>` : ''}
  `;
}

function fitToEntries() {
  const list = db.all();
  if (!list.length) return;
  const bounds = L.latLngBounds(list.map(e => [e.lat, e.lng]));
  map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
}

// ── Add / edit flow ────────────────────────────────────────────────────────
let pendingLoc = null;
let editingId  = null;

function startAdd() {
  editingId = null;
  document.getElementById('sheet-title').textContent = 'Nova piva 🍺';
  document.getElementById('f-beer').value  = '';
  document.getElementById('f-place').value = '';
  document.getElementById('f-price').value = '';
  document.getElementById('f-note').value  = '';
  setStars(0);

  const c = map.getCenter();
  setTempLocation(c.lat, c.lng);
  openSheet();
  useCurrentLocation(true);
}

function setTempLocation(lat, lng) {
  pendingLoc = { lat, lng };
  if (tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.marker([lat, lng], { icon: beerIcon, opacity: .65, draggable: true }).addTo(map);
  tempMarker.on('dragend', () => {
    const p = tempMarker.getLatLng();
    pendingLoc = { lat: p.lat, lng: p.lng };
    updateLocChip();
  });
  updateLocChip();
}

function updateLocChip() {
  const el = document.getElementById('sheet-loc');
  if (pendingLoc) {
    el.innerHTML = `📍 ${pendingLoc.lat.toFixed(5)}, ${pendingLoc.lng.toFixed(5)}
      <span style="color:var(--muted);font-weight:400"> · povuci pin</span>`;
  } else {
    el.textContent = '📍 Lokacija nije odabrana';
  }
}

function useCurrentLocation(silent) {
  if (!navigator.geolocation) {
    if (!silent) toast('Geolokacija nije dostupna');
    return;
  }
  const lbl = document.getElementById('geo-btn-label');
  lbl.textContent = 'Tražim lokaciju…';
  navigator.geolocation.getCurrentPosition(
    pos => {
      lbl.textContent = 'Koristi trenutnu lokaciju';
      const { latitude: lat, longitude: lng } = pos.coords;
      setTempLocation(lat, lng);
      map.setView([lat, lng], 16);
    },
    () => {
      lbl.textContent = 'Koristi trenutnu lokaciju';
      if (!silent) toast('Ne mogu dohvatiti lokaciju');
    },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
  );
}

// ── Stars ──────────────────────────────────────────────────────────────────
let currentRating = 0;
function setStars(n) {
  currentRating = n;
  document.querySelectorAll('#star-pick .star').forEach(s =>
    s.classList.toggle('on', Number(s.dataset.v) <= n)
  );
}

document.querySelectorAll('#star-pick .star').forEach(s => {
  s.addEventListener('click', () => {
    const v = Number(s.dataset.v);
    setStars(v === currentRating ? 0 : v);
  });
});

// ── Sheet ──────────────────────────────────────────────────────────────────
function openSheet() {
  document.getElementById('sheet-backdrop').classList.add('open');
  setTimeout(() => document.getElementById('f-beer').focus(), 300);
}
function closeSheet() {
  document.getElementById('sheet-backdrop').classList.remove('open');
  if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
  editingId = null;
}

document.getElementById('sheet-backdrop').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeSheet();
});
document.getElementById('sheet-close-btn').addEventListener('click', closeSheet);
document.getElementById('sheet-cancel-btn').addEventListener('click', closeSheet);
document.getElementById('geo-btn').addEventListener('click', () => useCurrentLocation(false));
document.getElementById('fab-add').addEventListener('click', startAdd);

// ── Save ───────────────────────────────────────────────────────────────────
document.getElementById('save-btn').addEventListener('click', saveEntry);

function saveEntry() {
  const beer = document.getElementById('f-beer').value.trim();
  if (!beer) {
    toast('Upiši koju si pivu popio');
    document.getElementById('f-beer').focus();
    return;
  }
  if (!pendingLoc) { toast('Odaberi lokaciju na karti'); return; }

  const data = {
    beer,
    place:  document.getElementById('f-place').value.trim(),
    rating: currentRating,
    price:  document.getElementById('f-price').value.trim(),
    note:   document.getElementById('f-note').value.trim(),
    lat: pendingLoc.lat,
    lng: pendingLoc.lng,
  };

  if (editingId) {
    db.update(editingId, data);
    // refresh popup if marker exists
    if (markers[editingId]) markers[editingId].setPopupContent(popupHtml({ ...data, id: editingId, ts: db.all().find(e => e.id === editingId)?.ts || Date.now() }));
    toast('Spremljeno ✓');
  } else {
    const entry = { id: Date.now().toString(), ts: Date.now(), ...data };
    db.add(entry);
    addMarker(entry);
    toast('Živjeli! 🍻');
  }

  if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
  closeSheet();
  renderList();
  renderStats();
}

// ── Edit ───────────────────────────────────────────────────────────────────
function editEntry(id) {
  const e = db.all().find(x => x.id === id);
  if (!e) return;
  editingId = id;
  document.getElementById('sheet-title').textContent = 'Uredi pivu ✏️';
  document.getElementById('f-beer').value  = e.beer  || '';
  document.getElementById('f-place').value = e.place || '';
  document.getElementById('f-price').value = e.price || '';
  document.getElementById('f-note').value  = e.note  || '';
  setStars(e.rating || 0);
  showTab('map');
  map.setView([e.lat, e.lng], 16);
  setTempLocation(e.lat, e.lng);
  openSheet();
}

// ── Delete (custom confirm) ────────────────────────────────────────────────
let pendingDeleteId = null;

function deleteEntry(id) {
  const e = db.all().find(x => x.id === id);
  if (!e) return;
  pendingDeleteId = id;
  document.getElementById('confirm-sub').textContent = `„${e.beer}" bit će trajno obrisan.`;
  document.getElementById('delete-confirm').classList.add('open');
}

document.getElementById('confirm-cancel-btn').addEventListener('click', () => {
  document.getElementById('delete-confirm').classList.remove('open');
  pendingDeleteId = null;
});

document.getElementById('confirm-ok-btn').addEventListener('click', () => {
  if (!pendingDeleteId) return;
  if (markers[pendingDeleteId]) { map.removeLayer(markers[pendingDeleteId]); delete markers[pendingDeleteId]; }
  db.remove(pendingDeleteId);
  document.getElementById('delete-confirm').classList.remove('open');
  pendingDeleteId = null;
  renderList();
  renderStats();
  toast('Obrisano 🗑️');
});

// ── List ───────────────────────────────────────────────────────────────────
function renderList() {
  const el   = document.getElementById('tab-list');
  const list = db.all();

  if (!list.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon-wrap">🍺</div>
        <div class="empty-text">Još nema zabilježenih piva</div>
        <div class="empty-hint">Idi na „Karta" i pritisni ＋ da dodaš prvu</div>
      </div>`;
    return;
  }

  el.innerHTML = `<div class="list">${list.map(e => `
    <div class="card">
      <div class="card-stripe"></div>
      <div class="card-emoji">🍺</div>
      <div class="card-body" data-goto="${e.id}">
        <div class="card-beer">${escapeHtml(e.beer)}</div>
        ${e.place ? `<div class="card-place">📍 ${escapeHtml(e.place)}</div>` : ''}
        ${e.rating ? `<div class="card-stars">${starStr(e.rating)}</div>` : ''}
        ${e.note ? `<div class="card-note">„${escapeHtml(e.note)}"</div>` : ''}
        <div class="card-meta">
          <span>🗓 ${fmtDate(e.ts)} · ${fmtTime(e.ts)}</span>
          ${e.price ? `<span>💶 ${escapeHtml(e.price)} €</span>` : ''}
        </div>
      </div>
      <div class="card-actions">
        <button class="icon-btn" data-edit="${e.id}" aria-label="Uredi">✏️</button>
        <button class="icon-btn del" data-delete="${e.id}" aria-label="Obriši">🗑️</button>
      </div>
    </div>`).join('')}</div>`;

  // single delegated handler
  el.querySelectorAll('[data-goto]').forEach(el2 =>
    el2.addEventListener('click', () => goToOnMap(el2.dataset.goto))
  );
  el.querySelectorAll('[data-edit]').forEach(btn =>
    btn.addEventListener('click', e => { e.stopPropagation(); editEntry(btn.dataset.edit); })
  );
  el.querySelectorAll('[data-delete]').forEach(btn =>
    btn.addEventListener('click', e => { e.stopPropagation(); deleteEntry(btn.dataset.delete); })
  );
}

function goToOnMap(id) {
  const e = db.all().find(x => x.id === id);
  if (!e) return;
  showTab('map');
  map.setView([e.lat, e.lng], 17);
  if (markers[id]) markers[id].openPopup();
}

// ── Stats ──────────────────────────────────────────────────────────────────
function renderStats() {
  const el   = document.getElementById('tab-stats');
  const list = db.all();

  if (!list.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon-wrap">📊</div>
        <div class="empty-text">Nema podataka za statistiku</div>
        <div class="empty-hint">Dodaj barem jednu pivu pa se vrati ovamo</div>
      </div>`;
    return;
  }

  const total       = list.length;
  const uniquePlaces = new Set(list.map(e => (e.place||'').toLowerCase().trim()).filter(Boolean)).size;
  const rated       = list.filter(e => e.rating > 0);
  const avgRating   = rated.length ? rated.reduce((a,e) => a + e.rating, 0) / rated.length : 0;
  const totalSpent  = list.reduce((a,e) => a + (parseFloat(e.price) || 0), 0);
  const avgSpent    = totalSpent > 0 ? totalSpent / total : 0;

  const counts = {};
  list.forEach(e => {
    const k = e.beer.trim();
    counts[k] = counts[k] || { name: k, n: 0 };
    counts[k].n++;
  });
  const top  = Object.values(counts).sort((a,b) => b.n - a.n).slice(0, 6);
  const maxN = Math.max(...top.map(t => t.n), 1);
  const medals = ['🥇','🥈','🥉'];

  el.innerHTML = `
    <div class="stats-content">
      <div class="stats-header">Tvoja statistika 📊</div>

      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-icon">🍺</div>
          <div class="summary-value">${total}</div>
          <div class="summary-label">Ukupno</div>
        </div>
        <div class="summary-card">
          <div class="summary-icon">📍</div>
          <div class="summary-value">${uniquePlaces || '—'}</div>
          <div class="summary-label">Lokacija</div>
        </div>
        <div class="summary-card">
          <div class="summary-icon">⭐</div>
          <div class="summary-value">${avgRating ? avgRating.toFixed(1) : '—'}</div>
          <div class="summary-label">Prosj. ocj.</div>
        </div>
      </div>

      ${totalSpent > 0 ? `
      <div class="summary-grid summary-2col">
        <div class="summary-card">
          <div class="summary-icon">💸</div>
          <div class="summary-value">${totalSpent.toFixed(2)} €</div>
          <div class="summary-label">Potrošeno</div>
        </div>
        <div class="summary-card">
          <div class="summary-icon">💶</div>
          <div class="summary-value">${avgSpent.toFixed(2)} €</div>
          <div class="summary-label">Prosj./piva</div>
        </div>
      </div>` : ''}

      <div class="section-title">Najčešće pive</div>
      <div class="rank-card">
        ${top.map((t, i) => `
          <div class="rank-row">
            <div class="rank-pos">${medals[i] || (i + 1) + '.'}</div>
            <div class="rank-name">${escapeHtml(t.name)}</div>
            <div class="rank-bar-wrap">
              <div class="rank-bar" style="--target:${(t.n / maxN) * 100}%;animation-delay:${i * 80}ms;width:var(--target)"></div>
            </div>
            <div class="rank-count">${t.n}×</div>
          </div>`).join('')}
      </div>
    </div>`;
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.id === `tab-${tab}`)
  );
  document.querySelectorAll('.nav-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab)
  );
  if (tab === 'list')  renderList();
  if (tab === 'stats') renderStats();
  if (tab === 'map' && map) setTimeout(() => map.invalidateSize(), 100);
}

document.querySelectorAll('.nav-btn').forEach(btn =>
  btn.addEventListener('click', () => showTab(btn.dataset.tab))
);

// ── Init ───────────────────────────────────────────────────────────────────
window.addEventListener('load', initMap);
</script>
</body>
</html>
